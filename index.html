s los días es lo que recomiendan los veterinarios, pero muy pocos dueños lo sostienen. La buena noticia es que no es todo o nada: hay formas de cuidar la boca que no requieren abrirla.`},{type:`h`,text:`1. Aditivos para el agua`},{type:`p`,text:`Se agregan al bebedero y actúan cada vez que tu mascota toma. Son la opción que menos cambia la rutina. Buscá productos con sello VOHC: indica que superaron ensayos de reducción de placa o sarro.`},{type:`h`,text:`2. Snacks y alimentos dentales`},{type:`p`,text:`Algunos están diseñados para limpiar por fricción al masticar. Elegí los que tengan respaldo y contá sus calorías dentro de la dieta diaria.`},{type:`h`,text:`3. Geles y sprays`},{type:`p`,text:`Se aplican directo sobre dientes y encías. Piden un poco de colaboración, pero mucho menos que el cepillo.`},{type:`h`,text:`Lo que ninguno reemplaza`},{type:`p`,text:`La limpieza profesional. Si ya hay sarro, ningún producto lo va a sacar: hace falta una limpieza veterinaria. Lo ideal es empezar el cuidado diario justo después, para mantener el resultado.`},{type:`ul`,items:[`Evitá huesos, astas y juguetes muy duros: pueden fracturar dientes.`,`Revisale la boca una vez por mes.`,`Hacé un control dental al menos una vez al año.`]}]},{id:`mal-aliento`,tag:`Perros`,title:`Mal aliento en perros: cuándo es normal y cuándo no`,excerpt:`El “aliento a perro” no es inevitable. Qué lo causa, qué señales mirar y cuándo conviene consultar.`,minutes:4,species:`perro`,body:[{type:`p`,text:`Que el aliento de tu perro no huela a menta es esperable. Pero un olor fuerte, que se siente a distancia o que empeora con las semanas, casi nunca es normal: en la mayoría de los casos viene de la boca, y en particular de la placa bacteriana.`},{type:`h`,text:`Por qué pasa`},{type:`p`,text:`Después de cada comida se forma sobre los dientes una película de bacterias: la placa. Si no se remueve, en pocos días empieza a endurecerse y se convierte en sarro, que ya no sale en casa. Las bacterias que viven ahí, sobre todo debajo de la encía, producen compuestos con olor fuerte.`},{type:`h`,text:`Señales para mirar`},{type:`ul`,items:[`Olor fuerte que se siente sin acercarte demasiado.`,`Sarro amarillo o marrón en muelas y colmillos.`,`Una línea roja en el borde de la encía.`,`Babeo, sangrado o que mastique de un solo lado.`]},{type:`h`,text:`Cuándo consultar`},{type:`p`,text:`Si ves sarro marrón, encías que sangran o le cuesta comer, pedí una revisión: eso ya no se resuelve en casa y suele requerir una limpieza profesional. También conviene consultar si el olor cambia mucho de un día para el otro, porque puede tener causas que no son dentales.`},{type:`h`,text:`Cómo prevenirlo`},{type:`p`,text:`Lo que más rinde es el cuidado diario. El cepillado sigue siendo la referencia; si no podés sostenerlo, sumá opciones que no dependan de él, como un aditivo para el agua con sello VOHC, y mantené los controles con tu veterinario.`}]},{id:`sarro-gatos`,tag:`Gatos`,title:`Sarro en gatos: señales que conviene no ignorar`,excerpt:`Los gatos disimulan el dolor. Estas son las pistas que da su boca antes de que el problema crezca.`,minutes:4,species:`gato`,body:[{type:`p`,text:`Los gatos son expertos en esconder molestias, así que los problemas dentales suelen avanzar sin que nadie lo note. Por eso vale la pena aprender a leer las señales indirectas.`},{type:`h`,text:`Lo que podés ver`},{type:`ul`,items:[`Una línea roja donde la encía toca el diente (gingivitis).`,`Sarro amarillento o marrón, sobre todo en las muelas de atrás.`,`Mal aliento que no se va.`]},{type:`h`,text:`Lo que podés notar en su conducta`},{type:`ul`,items:[`Mastica de un solo lado o deja caer comida.`,`Prefiere el alimento húmedo y evita el seco.`,`Babea, se toca la boca con la pata o se acicala menos.`]},{type:`h`,text:`Qué hacer`},{type:`p`,text:`Si aparece alguna de estas señales, consultá con tu veterinario: en gatos son frecuentes problemas que solo se detectan en una revisión completa. Para la prevención diaria, como muchos gatos no toleran el cepillo, lo que va en el agua es de lo más fácil de sostener. Si usa fuente, retirá el filtro mientras uses el aditivo.`}]},{id:`sello-vohc`,tag:`Evidencia`,title:`Qué es el sello VOHC y por qué importa`,excerpt:`Muchos productos dicen “cuidar los dientes”. El sello VOHC es una de las pocas formas de saber cuáles lo demostraron.`,minutes:3,body:[{type:`p`,text:`Casi cualquier snack o líquido puede decir que cuida los dientes. El sello del Veterinary Oral Health Council (VOHC) sirve para separar las promesas de los resultados medidos.`},{type:`h`,text:`Quién lo otorga`},{type:`p`,text:`El VOHC es una organización independiente creada por el American Veterinary Dental College para evaluar productos dentales para perros y gatos.`},{type:`h`,text:`Qué significa`},{type:`p`,text:`Que el producto alcanzó o superó el estándar del VOHC de reducción de placa y/o sarro en ensayos controlados, aleatorizados y ciegos. La empresa presenta los resultados de esos ensayos, hechos según los protocolos del VOHC, y el consejo los revisa.`},{type:`h`,text:`Cómo usarlo a tu favor`},{type:`ul`,items:[`Buscá el sello en el envase o en vohc.org, donde está la lista de productos aceptados.`,`Fijate si el sello es para placa, para sarro o para ambos.`,`Ningún producto reemplaza los controles veterinarios.`]},{type:`p`,text:`HealthyMouth® tiene el sello VOHC para su aditivo para el agua y su gel.`}]}],iO=[{q:`¿Le cambia el gusto al agua?`,a:`La fórmula original está pensada para que la tomen sin problema. Igual, conviene empezar con media dosis la primera semana. Si la rechaza, mezclala en la comida y pasala de a poco al agua. También hay versiones saborizadas: carne, pollo, arándano y maní.`},{q:`¿Reemplaza la limpieza en el veterinario?`,a:`No. Si ya hay sarro, la limpieza profesional es la que lo saca. HealthyMouth® funciona mejor justo después de una limpieza, para mantener el resultado. Antes de empezar, se recomienda una revisión veterinaria.`},{q:`¿Cuánto dura un frasco?`,a:`Se usa 1 cucharadita (5 mL) por litro de agua. El frasco de 8 oz prepara unos 47 litros; el de 16 oz, unos 94; y el de 36 oz, más de 210.`},{q:`¿Es seguro si mi mascota tiene alguna enfermedad?`,a:`La marca informa estudios de seguridad de uso diario de hasta 8 años y lo indica para todas las etapas de la vida, incluso con problemas renales, hepáticos, cardíacos, tiroideos o diabetes. Si tu mascota está en tratamiento, consultá antes con tu veterinario.`},{q:`¿Sirve si toma de una fuente?`,a:`Sí. Si la fuente tiene filtro, sacalo mientras uses el producto para que no lo retenga.`},{q:`¿Qué significa VOHC Accepted?`,a:`Que el producto alcanzó el estándar de reducción de placa y/o sarro del Veterinary Oral Health Council, en ensayos controlados, aleatorizados y ciegos.`},{q:`¿Puedo comprar desde este sitio?`,a:`No. Es un proyecto académico: el carrito y el checkout son una simulación y no se cobra nada. Para comprar de verdad, entrá a healthymouth.com.`}]}));EC(),IT(),LE(),aO(),oD();function oO(){let[e,...t]=rO;return(0,Y.jsx)(`section`,{id:`guias`,className:`relative bg-surface py-24 md:py-36`,children:(0,Y.jsxs)(`div`,{className:`mx-auto max-w-[1400px] px-4 md:px-8`,children:[(0,Y.jsxs)(`div`,{className:`grid gap-6 lg:grid-cols-12`,children:[(0,Y.jsxs)(`div`,{className:`lg:col-span-7`,children:[(0,Y.jsx)(kT,{children:`Guías para dueños`}),(0,Y.jsx)(DT,{as:`h2`,text:`Lo que más se pregunta, respondido.`,className:`mt-5 text-[2.6rem] font-semibold leading-[0.98] tracking-[-0.035em] text-ink md:text-6xl`})]}),(0,Y.jsx)(wT,{className:`lg:col-span-4 lg:col-start-9 lg:self-end`,delay:.1,children:(0,Y.jsx)(`p`,{className:`text-lg leading-relaxed text-ink-2`,children:`Mal aliento, sarro y cómo cuidar los dientes sin cepillo. Notas cortas, para leer en un rato.`})})]}),(0,Y.jsxs)(TT,{className:`mt-14 grid gap-4 lg:grid-cols-12 lg:gap-10`,stagger:.08,children:[(0,Y.jsx)(ET,{className:`lg:col-span-7`,children:(0,Y.jsxs)(`button`,{type:`button`,onClick:(
